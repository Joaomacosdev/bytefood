spring.application.name=bytefood
# MySQL Database Connection Properties
spring.datasource.url=jdbc:mysql://localhost:3306/db_bytefood_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# SECURITY - JWT
api.security.token.secret=${JWT_SECRET:12345}
api.security.token.expiration-days=11
api.security.token.issuer=API bytefood

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
//spring.mail.properties.mail.debug=true


# AWS Config

aws.s3.region=${AWS_REGION}
aws.s3.bucket=${AWS_BUCKET}
aws.secretKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}


##LOCAL REACT FRONTEND
base.payment.link=http://localhost:3000/pay?orderid=
frontend.base.url=http://localhost:3000


